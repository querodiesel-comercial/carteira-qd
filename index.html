<!doctype html>
<!--
  Casca do Carteira QD: o Chrome do Android só instala como app (tela cheia, sem barra) um site com manifesto, e o
  Apps Script não deixa ter um. Esta página tem o manifesto e mostra o app de verdade dentro dela, em tela cheia.
  Aqui não tem dado nenhum: login, permissões e carteira continuam no Apps Script.
  Para trocar o endereço do app, mude só a linha APP_URL abaixo.
  O app só aparece quando avisa que abriu (mensagem "carteiraQD:ok"). Sem login, o Okta/Google se recusa a abrir aqui
  dentro e ficaria uma tela branca: por isso a espera mostra o botão de entrar na conta.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Carteira QD</title>
<meta name="theme-color" content="#0229E9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carteira QD">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; visibility: hidden; }
  body.ok #app { visibility: visible; } body.ok #espera { display: none; }
  #espera { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; color: #4a5272; text-align: center; padding: 24px; }
  #espera img { width: 96px; height: 96px; }
  #espera b { color: #0d1430; font-size: 18px; }
  #espera p { margin: 0; font-size: 14px; max-width: 320px; }
  #ajuda { display: none; gap: 12px; justify-items: center; } #ajuda.mostra { display: grid; }
  .bt { display: inline-block; padding: 12px 22px; border-radius: 10px; background: #0229E9; color: #fff; font-weight: 600; font-size: 15px; text-decoration: none; border: 0; }
  .bt.sec { background: #eef1fe; color: #0229E9; }
  .lk { background: none; border: 0; color: #4a5272; font-size: 13px; text-decoration: underline; }
</style>
</head>
<body>
<div id="espera">
  <img src="icone-192.png" alt="">
  <b>Carteira QD</b>
  <p id="msg">Carregando…</p>
  <div id="ajuda">
    <p>Para abrir, entre na sua conta da empresa (@simcombustiveis.com.br). Depois de entrar, volte para cá.</p>
    <a id="entrar" class="bt" target="_blank" rel="noopener">Entrar na conta</a>
    <button id="denovo" class="bt sec" type="button">Tentar de novo</button>
    <button id="mesmo" class="lk" type="button">Abrir assim mesmo</button>
  </div>
</div>
<iframe id="app" title="Carteira QD" allow="clipboard-write; geolocation"></iframe>
<script>
  const APP_URL = "https://script.google.com/a/macros/simcombustiveis.com.br/s/AKfycbz_Ve_xyJttkzhybaNo2eHHzZKMMZ8j0juHwH4Te5HXY5ivVlKNDJi9WSwefeBuQhyfSg/exec";   // Implantar → Gerenciar implantações → URL do app da Web (termina em /exec)
  // iPhone/iPad (e Safari no Mac): o Safari não deixa o app do Google, dentro desta página, ver o login da conta
  // (bloqueio de cookies de outro site), então lá a casca não embute: abre o app direto, na página inteira.
  const SAFARI = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1) ||
    (/Safari\//.test(navigator.userAgent) && !/Chrome|Chromium|CriOS|Edg|OPR|Android/.test(navigator.userAgent));
  if (SAFARI) location.replace(APP_URL);
  const f = document.getElementById("app"), ajuda = document.getElementById("ajuda"), msg = document.getElementById("msg");
  let ok = false, espera;
  const abriu = () => { ok = true; clearTimeout(espera); document.body.classList.add("ok"); };
  function carrega() {
    ajuda.classList.remove("mostra"); msg.textContent = "Carregando…";
    f.src = APP_URL;
    // em 10 s sem o app avisar que abriu (sem login na conta da empresa, quase sempre): mostra o caminho para entrar
    clearTimeout(espera);
    espera = setTimeout(() => { msg.textContent = "Não conseguiu abrir a carteira."; ajuda.classList.add("mostra"); }, 10000);
  }
  // o app do Apps Script roda num endereço *.googleusercontent.com
  addEventListener("message", e => { try { if (e.data === "carteiraQD:ok" && new URL(e.origin).hostname.endsWith(".googleusercontent.com")) abriu(); } catch (x) { /* origem estranha */ } });
  document.getElementById("entrar").href = APP_URL;
  document.getElementById("denovo").onclick = carrega;
  document.getElementById("mesmo").onclick = abriu;
  // voltou do login em outra aba: tenta de novo sozinho
  document.addEventListener("visibilitychange", () => { if (!ok && document.visibilityState === "visible" && ajuda.classList.contains("mostra")) carrega(); });
  if (!SAFARI) carrega();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
